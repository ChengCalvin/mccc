schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  MCCC (Montreal Chinese Chamber of Commerce) official site — trilingual (zh/en/fr, zh default).
  Target stack (see changes/astro-migration): Astro, static output, no JS UI framework, plain CSS
  custom properties (no Tailwind), Astro Content Collections + built-in i18n routing, deployed
  static to Vercel. No package.json yet — this is pre-scaffold; astro-migration task 1.1 does the
  actual `npm create astro@latest`. Preserve existing visual design/copy exactly; no redesign.
  This build is meant to later generalize into a reusable client-site starter — avoid
  MCCC-specific choices where a generic equivalent is equally simple.

